name: Daily Bluesky Poster for CubeBuff

on:
  schedule:
    # 北京时间每天早上 06:00 (UTC 时间前一天 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮一键运行

permissions:
  contents: write # 赋予写入权限，以便回写保存已发帖历史记录

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Bluesky Poster
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          python daily_poster.py 20

      - name: Commit and Push Posted History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json || true
          git commit -m "Auto-update posted history [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
